  <script>
    const projects = {
      '01':['CAPSTONE PROJECT','NQU AI Assistant','結合校園知識庫、語音互動與大型語言模型的智慧資訊助理',['Python','RAG','LLM','Unity'],'visual-ai'],
      '02':['RESEARCH','智慧居家機器人的自然語言處理與任務規劃','以中文語音辨識模型為基礎，支援智慧居家機器人的語言理解與任務規劃',['Speech AI','Fine-tuning','CER'],'visual-speech'],
      '03':['WEB DESIGN','TO DO LIST網頁','以待辦事項管理為主題的網頁作品，整合任務建立、分類、期限與狀態管理',['HTML','CSS','JavaScript'],'visual-web'],
      '04':['GAME PROJECT','多啦A夢冒險','以 Unity 製作的 2D 冒險遊戲，累積分數、蒐集道具並閃躲攻擊，直到擊敗 Boss',['Unity','C#','Boss Battle','Item Collection'],'visual-game'],
      '05':['GAME PROJECT','Soul Reclaimer','以 Unity 製作三個主題關卡的 2D 遊戲，結合角色操作、敵人戰鬥、回血道具與場景切換',['Unity','C#','Combat','Scene Flow'],'visual-game-two'],
      '06':['DATA ANALYSIS','平均預期壽命數據分析','透過資料整理與視覺化分析觀察平均預期壽命變化',['Python','Data Analysis','Visualization'],'visual-data'],
      '07':['AI APPLICATION','人工智慧於柳丁品質分析之應用','以資料探勘與分類模型分析柳丁品質，探索人工智慧支援農業品質判斷的可行性',['Weka','Data Mining','Random Forest','Classification'],'visual-orange'],
      '08':['WEB DESIGN','C# 網頁設計','以 ASP.NET Core 建立多頁式管理網站，整合會員登入、公告與相簿管理、SQLite 操作及互動功能',['ASP.NET Core','Razor Pages','SQLite','CRUD'],'visual-csharp'],
      '09':['PROGRAMMING','Python 天氣預報爬蟲','串接氣象資料開放平臺 API，依縣市取得一週預報並繪製氣溫變化圖',['Python','CWA API','JSON','Matplotlib'],'visual-scraper'],
      '10':['SYSTEM PROJECT','Multithread在爬蟲的應用','以 Python 爬取十二星座每日運勢，分別實作循序爬蟲與多線程版本，並將結果寫入 SQLite',['Python','BeautifulSoup','Multithreading','SQLite'],'visual-thread'],
      '11':['INTERACTIVE PROJECT','Modern Magic Mirror','以 Python 整合臉部辨識、語音辨識與星座運勢查詢，打造具有互動回應的智慧魔鏡',['Python','OpenCV','Speech Recognition','Web Scraping'],'visual-mirror'],
      '12':['PERSONAL PROJECT','個人網頁','整理個人經歷、學習成果與作品內容的個人網站',['HTML','CSS','JavaScript','UI Design'],'visual-portfolio']
    };
    const projectDetails = {
      '01': {
        concept: 'NQU AI Assistant 是一個以國立金門大學校園資訊為核心的智慧互動助理。我們觀察到，校內資訊分散在不同文件與網頁中，使用者需要花費時間查找，也不一定能判斷答案是否正確。因此，專題希望結合語音互動、校園知識庫與大型語言模型，讓使用者以自然的方式提問並取得較具依據的回答。',
        content: '使用者可以透過麥克風提出問題，系統先將語音轉換為文字，再依照問題內容進行處理。後端會判斷問題是否涉及校園知識庫；若有對應內容，便透過 RAG 檢索相關資料，再交由語言模型產生回答；完成後再將文字轉換為語音，回傳至 Unity 介面播放。',
        technology: '前端互動介面使用 Unity 與 C#，後端以 Python 撰寫，並透過 WebSockets 進行前後端連接與資料傳輸。系統以 RAG 方式結合校園知識資料，並搭配語音轉文字（STT）、大型語言模型（LLM）、文字轉語音（TTS）與 JSON 資料傳輸。',
        role: '我主要負責前端與後端程式碼撰寫，以及前後端之間的連接與整合，包含語音輸入後的資料傳遞、問題處理流程、RAG 資料檢索、LLM 回答、文字轉語音，以及 WebSockets 與 Unity 之間的即時溝通。我也參與資料研究、資料篩選與功能討論，協助團隊將校園資訊整理成系統可以使用的內容。',
        learning: '這項專題讓我理解，完成一個 AI 系統不只是選擇模型，也需要處理資料品質、模組溝通、錯誤情況與實際使用流程。當 Python 後端需要與 Unity 互動時，我也學習如何處理不同語言與執行環境之間的整合問題。專題成果獲得畢業專題第二名與人氣獎，讓我更確定自己對智慧系統、資訊整合與技術實際應用的興趣。'
      },
      '02': {
        concept: '本研究以 OpenAI Whisper-small 為基礎，使用中文語音資料進行微調，探討模型在特定語句與資料範圍內的辨識表現。研究重點不只在於訓練模型，也包含資料準備、評估設計與結果解讀。',
        content: '將語音檔案路徑與文字標註整理為 JSON 資料，透過 Scikit-Learn 以 80／20 切分訓練集與驗證集。音訊經 Librosa 統一重採樣至 16 kHz，再由 WhisperProcessor 轉換為 Log-Mel 特徵與文字 Token；訓練完成後，使用驗證集進行生成、CER 計算與語句類別混淆矩陣分析，並保存微調後的模型與 Processor。',
        technology: 'Python、PyTorch、Librosa、Hugging Face Datasets、Transformers、WhisperProcessor、WhisperForConditionalGeneration、Seq2SeqTrainer、Scikit-Learn、JiWER 與 Seaborn。訓練設定包含 learning rate 1e-5、batch size 4、gradient accumulation 2、10 epochs、每 20 steps 評估一次，並視硬體條件啟用 FP16。',
        role: '負責語音資料蒐集與整理、文字標註檢查、音訊前處理、模型微調程式撰寫，以及訓練與驗證流程的執行。完成訓練後，我也整理 CER、loss curve 與混淆矩陣等結果，協助判讀模型在既定語句範圍內的表現。',
        learning: '我學會將語音資料、模型訓練與評估流程串成可重複執行的研究流程，也理解模型 loss 下降不代表能直接推論所有情境都能正確辨識。本次實驗在 10 類固定語句、50 筆驗證樣本的類別配對分析中，預測結果集中於混淆矩陣對角線；既有評估紀錄的 CER 為 0.01246，但仍需在更多說話者、未見語句與噪音環境下進一步驗證。'
      },
      '03': {
        concept: 'TO DO LIST網頁是一個以日常任務管理為主題的前端作品，將待辦事項的建立、分類、期限與完成狀態集中在同一個介面中，協助使用者快速掌握目前需要處理的工作。',
        content: '使用者可以輸入任務、設定日期與分類，透過核取方塊標記完成狀態，也能直接編輯或刪除既有任務。畫面提供分類篩選與日期排序，讓使用者可以依照工作、生活、學習或其他需求整理清單；任務資料則透過 localStorage 保存在瀏覽器中。詳細畫面展示了作品成果、分類篩選、日期降序與任務編輯等操作情境。',
        technology: 'HTML、CSS、JavaScript、Font Awesome 與 Web Storage API（localStorage）。',
        role: '負責頁面結構、視覺排版、任務資料管理與互動功能實作，包含新增、完成切換、刪除、編輯、分類篩選、日期升降序排列及瀏覽器資料儲存。',
        learning: '透過這個作品，我熟悉從表單輸入、事件監聽到資料狀態更新的前端開發流程，也理解使用者操作後需要即時反映在畫面與儲存資料中。作品讓我練習將多個小功能整理成清楚、可持續使用的操作流程。'
      },
      '04': {
        concept: '多啦A夢冒險是一款以累積分數與挑戰 Boss 為核心的 Unity 2D 遊戲。玩家需要操控角色在關卡中持續前進，盡可能蒐集回血與強化等有利道具，同時閃躲敵人與 Boss 的攻擊，直到累積足夠分數並完成最後挑戰。',
        content: '遊戲提供角色移動與基本武器攻擊，敵人會持續出現並向玩家靠近。玩家可以透過擊退敵人累積分數，並依照遊戲進度取得回血道具與武器強化道具；取得強化後可使用鈴鐺攻擊。當分數達到 500 後出現 Boss，玩家必須在維持自身血量的同時持續攻擊，將 Boss 的生命值降至 0。系統也整合開始、退出、重玩、背景音樂、按鈕音效、碰撞音效與勝敗畫面。',
        technology: 'Unity、C#、MonoBehaviour、Unity Input API、Collider2D 觸發事件、Instantiate／Destroy 物件生成與生命週期管理、SceneManager 場景切換，以及 TextMeshPro 與 Image.fillAmount UI。背景材質位移、角色與敵人移動、分數與血量狀態、Boss 血條和碰撞特效皆由腳本控制。',
        role: '本作品的遊戲構想、介面設計、地圖與關卡流程規劃，以及角色、敵人與 Boss 互動機制皆由我自行完成。實作內容包含角色移動、基本武器、敵人生成與碰撞、道具效果、血量與分數顯示、Boss 戰鬥流程，以及開始、重玩與勝敗畫面的整合。',
        learning: '透過這項作品，我學會將遊戲目標拆解為角色控制、敵人行為、道具系統、分數條件與 Boss 狀態，再使用 Unity 與 C# 串成完整流程。從獨立規劃到完成實作的過程中，我也更熟悉碰撞事件、物件生成、UI 狀態同步與關卡節奏之間的關聯，並透過測試調整遊戲難度與操作感。'
      },
      '05': {
        concept: 'Soul Reclaimer 是一款以場景探索與戰鬥挑戰為核心的 2D 遊戲。玩家需要操控角色穿越不同區域，面對各具特色的敵人與 Boss，並適時使用回血道具維持戰鬥能力，完成每個場景的挑戰。',
        content: '遊戲包含森林、沙漠與雪地三個主題場景，各關卡具有不同的敵人配置與挑戰。玩家透過四方向移動探索場景，擊敗當前區域的敵人後開啟通往下一個場景的路徑；在戰鬥過程中，玩家可以取得回血道具恢復生命值，最後在雪地場景面對兩個 Boss，擊敗所有敵人與 Boss 後完成遊戲。',
        technology: 'Unity、C#、MonoBehaviour、Unity Input System、Cinemachine、場景邊界切換、角色與敵人行為控制、碰撞判定、物件互動與關卡條件管理。',
        role: '本作品由兩人共同完成。我主要負責程式碼撰寫，包含場景切換、角色控制、敵人行為、Boss 攻擊機制、碰撞判定，以及整體遊戲進行流程的設計與實作。',
        learning: '透過這項作品，我學會將不同場景的規則與通關條件轉化為程式邏輯，並處理角色、敵人、回血道具與場景狀態之間的互動。實作過程也讓我更熟悉遊戲流程規劃、敵人行為設計與多場景串接。'
      },
